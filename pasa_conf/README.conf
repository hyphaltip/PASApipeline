A file 'conf.txt' provides the PASA configuration.

The 'pasa.CONFIG.template' provides a template for the 'conf.txt' file.  Copy it to 'conf.txt' and update the various settings accordingly. Most critical are the mysql username and password values.


The other templates: 'pasa.alignAssembly.Template.txt' and 'pasa.annotationCompare.Template.txt' are used as inputs to the alignment-assembly and annotation-comparisons steps of the PASA pipeline, and are provided here as templates that can be copied over to the individual PASA project working directories. (full details are provided at http://pasa.sf.net)


## SQLite vs MySQL: which backend to use

PASA's `DATABASE=` config value picks the backend automatically
(`DB_connect.pm::configure_db_driver`): a value containing `/` (a file
path) is treated as SQLite; anything else is treated as a MySQL database
name, resolved via `MYSQLSERVER`/`MYSQL_RW_USER`/`MYSQL_RW_PASSWORD` in
`conf.txt` (or a `--PASACONF` file, see `pasa.CONFIG.template`).

**Rule of thumb: tie the choice to `--CPU`/thread count, not project size.**

- **SQLite (default, `DATABASE=/path/to/db.sqlite`)** is fine for
  low-concurrency runs. As of the fixes below, `PerlLib/DB_connect.pm` sets
  `PRAGMA busy_timeout=30000`, `journal_mode=WAL`, `synchronous=NORMAL`,
  and `cache_size=-64000` on every SQLite connect, plus `do_sql_2D`/`RunMod`
  retry with backoff on `SQLITE_BUSY`/"database is locked" -- this makes the
  already-threaded scripts (`validate_alignments_in_db.dbi`,
  `assemble_clusters.dbi`, `alignment_assembly_to_gene_models.dbi`,
  `cDNA_annotation_comparer.dbi`, `find_alternate_internal_exons.dbi`,
  `assign_clusters_by_stringent_alignment_overlap.dbi`,
  `assign_clusters_by_gene_intergene_overlap.dbi`) safe at moderate thread
  counts (benchmarked clean through `--CPU 8` against `sample_data/`, see
  `benchmarks/`).
- **MySQL/MariaDB (`DATABASE=some_db_name` + `conf.txt`/`--PASACONF`
  pointing at a real server)** is still the better choice whenever you
  expect *sustained* high write concurrency, want a persistent shared
  server across multiple concurrent PASA runs, or are running on shared
  storage where SQLite's WAL-mode locking is unreliable (see caveat below).
  SQLite's busy_timeout/retry handling makes lock contention *survivable*,
  not free -- MySQL still has genuinely concurrent multi-writer support
  that SQLite's single-writer model can't match.
- **NFS/Lustre caveat**: SQLite WAL mode (and its `-wal`/`-shm` sidecar
  files) is unreliable over NFS and has known gaps on Lustre. If your PASA
  working directory sits on network-mounted shared storage (check with your
  HPC admins -- e.g. on UCR HPCC, most `/bigdata` and `/rhome` paths are
  NFS), either stage the SQLite DB to node-local scratch (`/scratch` or
  `$TMPDIR`) for the run and copy results back afterward, or use MySQL
  instead.

## Running MySQL/MariaDB alongside a Slurm-scheduled PASA run (Singularity)

For per-job (not persistent) MySQL, spin up a MariaDB Singularity container
scoped to the job -- this is the pattern used in production by
Fungi_BFD's `nextflow/funannotate.nf` (`FUNANNOTATE_TRAIN`/`RNASEQ_PREPARE`
processes) and reproduced for local benchmarking in
`benchmarks/run_bench_mysql.sh`:

1. **Initialize a fresh datadir per run** (or `rsync` a pre-populated one
   with your PASA user already granted, as production does):
   ```bash
   module load singularity
   singularity exec -B "$SCRATCH/db:/var/lib/mysql" "$MARIADB_SIF" \
     mysql_install_db --datadir=/var/lib/mysql --auth-root-authentication-method=normal
   ```
2. **Customize `my.cnf`** (copy `pasa_conf`'s template) with a random port
   per job to avoid collisions between concurrent Slurm array tasks on the
   same node:
   ```bash
   PORT=$(shuf -i 13000-13999 -n1)
   sed -i "s/^port = .*/port = $PORT/" "$SCRATCH/conf/my.cnf"
   ```
3. **Start the instance**, bind-mounting the datadir and config:
   ```bash
   export SINGULARITY_BINDPATH="$SCRATCH/db:/var/lib/mysql,$SCRATCH/conf/my.cnf:/etc/mysql/my.cnf"
   singularity instance start --writable-tmpfs "$MARIADB_SIF" "mysqldb_$SLURM_JOB_ID" /usr/bin/mysqld_safe
   ```
4. **Poll for readiness** (don't just `sleep N` blindly -- actively check):
   ```bash
   for i in $(seq 1 30); do
     singularity exec instance://"mysqldb_$SLURM_JOB_ID" \
       mysqladmin --socket=/var/run/mysqld/mysqld.sock ping >/dev/null 2>&1 && break
     sleep 1
   done
   ```
5. **Create the PASA database/user and a `conf.txt`/`--PASACONF` file**
   pointing `MYSQLSERVER=$(hostname -s):$PORT` at the container -- PASA's
   Perl DBI process connects over TCP from *outside* the container, so the
   host's short hostname (not `localhost`/`127.0.0.1`) must resolve and the
   container must bind all interfaces (`bind-address` commented out or set
   to `0.0.0.0` in `my.cnf`).
6. **Always trap instance teardown** so a killed/failed job doesn't leave
   an orphaned `mysqld` running:
   ```bash
   stop_mysqldb() { singularity instance stop "mysqldb_$SLURM_JOB_ID" 2>/dev/null || true; }
   trap "stop_mysqldb; exit 130" SIGHUP SIGINT SIGTERM
   trap "stop_mysqldb" EXIT
   ```

`benchmarks/run_bench_mysql.sh` is a working, minimal, runnable version of
this whole flow (using a scratch-generated dedicated user instead of a
pre-provisioned one) -- run it directly to sanity-check a Singularity/MySQL
setup on a new HPC system before wiring it into a production Slurm
pipeline. Verified end-to-end (fresh datadir init -> instance start ->
readiness poll -> user/DB creation -> full `sample_data/` align-assembly
run -> teardown) at `--CPU 4` and `--CPU 8`: identical `clusters`
(1202)/`align_link` (38592)/`subclusters` (1146) row counts vs the SQLite
benchmark runs, no lock/deadlock errors at either thread count.


